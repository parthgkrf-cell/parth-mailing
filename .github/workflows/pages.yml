name: Publish the desk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Prepare the static desk
        run: |
          mkdir -p site
          cp frontend/index.html frontend/app.js frontend/style.css frontend/worker.js site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the desk
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
